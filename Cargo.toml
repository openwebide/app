[workspace]
resolver = "2"
exclude = ["vendor/ec4rs", "vendor/tree-sitter-rust"]
members = [
    "backend",
    "bridge",
    "crates/agent",
    "crates/auth",
    "crates/core",
    "crates/llm",
    "crates/plugin-sdk",
    "crates/plugin-runtime",
    "crates/plugin-build",
    "crates/storage",
    "frontend",
    "tools/editor-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
authors = ["Brad Westness"]

[workspace.dependencies]
anyhow = "1"
argon2 = "0.6"
base64 = "0.23"
bytes = "1"
futures = "0.3"
gloo-net = { version = "0.7", features = ["websocket", "http"] }
hmac = "0.13"
http-body = "1"
http-body-util = "0.1.3"
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
openwebide-agent = { path = "crates/agent" }
openwebide-auth = { path = "crates/auth" }
openwebide-core = { path = "crates/core" }
openwebide-llm = { path = "crates/llm" }
openwebide-storage = { path = "crates/storage" }
pulldown-cmark = "0.13"
rand = "0.10"
sha2 = "0.11"
rusqlite = { version = "0.40", features = ["bundled"] }
send_wrapper = { version = "0.6", features = ["futures"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spin-sdk = { version = "7.0.0", default-features = false, features = ["http", "sqlite", "variables"] }
thiserror = "2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "KeyboardEvent",
    "ClipboardEvent",
    "DataTransfer",
    "FileList",
    "DragEvent",
    "ImageBitmap",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "KeyboardEventInit",
    "MouseEvent",
    "MouseEventInit",
    "EventInit",
    "Window",
    "console",
    "Navigator",
    "Clipboard",
    "Location",
    "Element",
    "Document",
    "Storage",
    "HtmlTextAreaElement",
    "HtmlInputElement",
    "HtmlElement",
    "CssStyleDeclaration",
    "AbortController",
    "AbortSignal",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "ReadableStreamReadResult",
    "TextDecoder",
    "TextDecodeOptions",
    "FileSystemFileHandle",
    "FileSystemDirectoryHandle",
    "FileSystemRemoveOptions",
    "FileSystemHandle",
    "FileSystemHandleKind",
    "DirectoryPickerOptions",
    "FileSystemPermissionMode",
    "FileSystemHandlePermissionDescriptor",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemWritableFileStream",
    "File",
    "Blob",
    "Response",
    "Url",
    "IdbFactory",
    "IdbDatabase",
    "IdbObjectStore",
    "IdbTransaction",
    "IdbRequest",
    "IdbTransactionMode",
    "IdbOpenDbRequest",
    "MediaQueryList",
] }

[profile.release]
opt-level = "s"
lto = true

# Keep `target/` small: line tables are enough for backtraces, and dependencies
# need no debug info. See AGENTS.md "Build disk usage".
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Keep grammar lexers compact and responsive in native/browser test builds.
# cc-rs uses each package profile's optimization level for its C sources too.
[profile.dev.package."tree-sitter"]
opt-level = 2

[profile.dev.package."tree-sitter-rust"]
opt-level = 2

[profile.dev.package."tree-sitter-typescript"]
opt-level = 2

[profile.dev.package."tree-sitter-javascript"]
opt-level = 2

[profile.dev.package."tree-sitter-python"]
opt-level = 2

[profile.dev.package."tree-sitter-java"]
opt-level = 2

[profile.dev.package."tree-sitter-c-sharp"]
opt-level = 2

[profile.dev.package."tree-sitter-cpp"]
opt-level = 2

[profile.dev.package."tree-sitter-php"]
opt-level = 2

[profile.dev.package."tree-sitter-bash"]
opt-level = 2

[profile.dev.package."tree-sitter-c"]
opt-level = 2

[profile.dev.package."tree-sitter-go"]
opt-level = 2

[profile.dev.package."tree-sitter-html"]
opt-level = 2

[profile.dev.package."tree-sitter-css"]
opt-level = 2

[workspace.lints.clippy]
# Leave off documentation/attribute churn: missing_errors_doc, missing_panics_doc,
# must_use_candidate, return_self_not_must_use, doc_markdown.
# Leave off framework constraints: too_many_lines, needless_pass_by_value,
# same_length_and_capacity (spin-sdk http_service expansion).
# Leave off style/micro-optimisation picks: map_unwrap_or, if_not_else,
# single_match_else, match_same_arms, items_after_statements, needless_continue,
# bool_to_int_with_if, default_trait_access, needless_raw_string_hashes,
# unreadable_literal, format_push_string, cast_precision_loss (tokens/s maths),
# implicit_hasher, struct_excessive_bools, assigning_clones, duration_suboptimal_units.
case_sensitive_file_extension_comparisons = "warn"
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
float_cmp = "warn"
ignored_unit_patterns = "warn"
manual_let_else = "warn"
match_wildcard_for_single_variants = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
trivially_copy_pass_by_ref = "warn"
uninlined_format_args = "warn"
unnecessary_wraps = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"
used_underscore_binding = "warn"

[patch.crates-io]
ec4rs = { path = "vendor/ec4rs" }
tree-sitter-rust = { path = "vendor/tree-sitter-rust" }

tree-sitter-language = { path = "vendor/tree-sitter-language" }
