[package]
name = "openwebide-bridge"
description = "Native WebSocket terminal and process execution bridge daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "openwebide-bridge"
path = "src/main.rs"

[features]
default = ["tls"]
tls = ["dep:hyper-rustls"]

[dependencies]
thiserror = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
http-body-util = { workspace = true }
hyper = { version = "1", features = ["server", "http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
libc = "0.2"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk", "component"] }
openwebide-core = { workspace = true }
openwebide-plugin-runtime = { path = "../crates/plugin-runtime" }
openwebide-agent = { workspace = true }
openwebide-llm = { workspace = true }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["ring", "webpki-roots", "http1"], optional = true }
portable-pty = "0.9"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "signal", "sync", "time", "fs"] }
tokio-tungstenite = "0.30"
rand = { workspace = true }
base64 = { workspace = true }
openwebide-auth = { workspace = true }

tempfile = "3"

[dev-dependencies]
openwebide-storage = { workspace = true }
openwebide-core = { workspace = true, features = ["test-support"] }
tokio = { version = "1", features = ["test-util"] }


[lints]
workspace = true
